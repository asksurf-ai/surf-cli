project_name: surf
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/surf
    binary: surf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./install.sh

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^style:"
      - "^test:"

# GitHub Releases is the only place binaries are published. The release workflow
# leaves the release a draft while it uploads, attests every file in
# checksums.txt, and only then publishes it, so a published release always has
# its attestations. A draft titled with the tag is reused, so release notes can
# be written there before the tag is pushed.
release:
  github:
    owner: asksurf-ai
    name: surf-cli
  draft: true
  use_existing_draft: true
  prerelease: auto
  mode: keep-existing
  extra_files:
    - glob: ./install.sh
